en:
  reports:
    ranges:
      "3_months": "Last 3 months"
      "6_months": "Last 6 months"
      "12_months": "Last 12 months"
      all_time: "All time"
    small_n: "Too few records (%{count}) for a meaningful chart. The table below is the source of truth."
    growth:
      suppressed: "Percentage omitted; previous period too small to be meaningful."
    application_growth:
      title: "Platform growth"
      description: "Application volumes, cumulative totals, and growth rates"
      series:
        created: "Applications created"
        submitted: "Applications submitted"
      columns:
        period: "Month"
        created: "Applications created"
        submitted: "Applications submitted"
        status: "Status"
        count: "Count"
      figures:
        total_created:
          label: "Applications created"
          help: "Applications created in %{range}, including drafts. Live (non-sandbox) records only."
        total_submitted:
          label: "Applications submitted"
          help: "Applications with a first submission in %{range}. Live (non-sandbox) records only."
        cumulative_processed:
          label: "Cumulative permits processed"
          help: "Applications submitted at least once since launch. This figure does not change with the selected range."
        mom_submissions:
          label: "Submissions, month over month"
          help: "Change in first submissions versus the previous month. %{change}"
        qoq_submissions:
          label: "Submissions, quarter over quarter"
          help: "Change in first submissions versus the previous quarter. %{change}"
        mom_accounts:
          label: "New accounts, month over month"
          help: "Change in newly created accounts versus the previous month. %{change}"
        qoq_accounts:
          label: "New accounts, quarter over quarter"
          help: "Change in newly created accounts versus the previous quarter. %{change}"
      notes:
        created_not_submitted: "Created counts include drafts. They are not submission counts."
        cumulative_independent: "Cumulative permits processed is counted since launch and ignores the selected range."
        growth_small_base: "Where the previous period has fewer than 10 records, the percentage is omitted and raw counts are shown."
    step_code_part_9:
      title: "Energy Step Code Part 9"
      description: "Part 9 submission volumes and compliance outcomes"
      unknown_jurisdiction: "Unknown jurisdiction"
      series:
        submissions: "Submissions"
      columns:
        period: "Month"
        count: "Count"
        submissions: "Submissions"
        jurisdiction: "Jurisdiction"
        enablement: "Step Code enablement"
        outcome: "Compliance outcome"
        energy_step: "Energy step achieved"
        zero_carbon_step: "Zero carbon step achieved"
      outcomes:
        pass: "Pass"
        fail: "Fail"
        incomplete: "Incomplete compliance data"
      energy_step: "Energy step %{step}"
      zero_carbon_step: "Zero carbon step %{step}"
      enablement:
        has_submissions: "Enabled, submissions in range"
        enabled_no_submissions: "Enabled, no submissions"
        not_enabled: "Not enabled"
      figures:
        total_submissions:
          label: "Part 9 submissions"
          help: "Part 9 Step Code submissions first submitted in %{range}. Live (non-sandbox) records only."
        pass_count:
          label: "Passed"
          help: "Submissions in %{range} where both energy and zero carbon proposed steps were achieved."
        fail_count:
          label: "Failed"
          help: "Submissions in %{range} with enough data to evaluate that did not achieve both required tracks. Incomplete records are counted separately."
        incomplete_count:
          label: "Incomplete compliance data"
          help: "Submissions in %{range} without enough checklist data to evaluate pass or fail. These are not counted as failures."
      notes:
        incomplete_not_fail: "Submissions with incomplete compliance data are counted on their own. They are not folded into failures."
        enablement: "Jurisdictions with no Step Code submissions are listed separately from jurisdictions that have not been configured with Step Code requirements."
        small_n: "When fewer than 10 submissions are in range, the tables lead and charts are omitted so a small count is not read as a trend."
    jurisdiction_enablement:
      title: "Jurisdiction inbox enablement"
      description: "Inbox enablement history, active jurisdictions, and time to first submission"
      yes: "Yes"
      no: "No"
      series:
        enabled_by_quarter: "Jurisdictions first enabled"
        submission_cohorts: "Jurisdictions with a first submission"
      columns:
        jurisdiction: "Jurisdiction"
        status: "Status"
        currently_enabled: "Currently enabled"
        first_enabled_on: "First enabled"
        last_changed_on: "Most recent change"
        cumulative_days: "Cumulative days enabled"
        submissions_in_range: "Submissions in range"
        days_to_first_submission: "Days to first submission (enabled time)"
        approximate: "Approximate"
      status:
        active: "Active"
        enabled_no_submissions: "Enabled, no submissions in range"
        previously_enabled: "Previously enabled"
        never_enabled: "Never enabled"
      figures:
        currently_enabled:
          label: "Currently enabled"
          help: "Jurisdictions whose inbox is on today."
        previously_enabled:
          label: "Previously enabled"
          help: "Jurisdictions that were enabled in the past and are off today. They remain in the table."
        never_enabled:
          label: "Never enabled"
          help: "Jurisdictions with no recorded inbox enablement."
        active:
          label: "Active"
          help: "Currently enabled and with at least one live submission in %{range}."
        enabled_never_submitted:
          label: "Enabled, never submitted"
          help: "Currently enabled jurisdictions with no live submissions since launch."
      notes:
        active_definition: "Active means the inbox is currently enabled and the jurisdiction has at least one live submission in the selected range."
        approximate: "Dates and cumulative days are marked approximate when any contributing event was seeded from the programme dataset or inferred from the earliest membership date."
        enabled_time: "Days to first submission counts only time the inbox was enabled. Gaps while the inbox was off are excluded. An open enabled interval is closed at now."
        churned_kept: "Jurisdictions that turned the inbox off stay in the table as previously enabled."
  arbitrary_message_construct:
    report:
      refresh_success:
        title: "Report refreshed"
        message: "The figures on this report are current."
      refresh_error:
        title: "Refresh failed"
        message: "Previous figures are still shown. Try again."
      not_found_error:
        title: "Not found"
        message: "That report does not exist."
