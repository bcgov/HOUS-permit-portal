name: Deploy a branch to TEST

# 🔐 Set least-privilege permissions for the entire workflow
permissions:
  contents: read
  deployments: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch Name"
        required: true
        default: "stable"

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    name: Build & Deploy Docker Rails / React application
    environment: test

    steps:
      - name: Checkout Workflow Code
        uses: actions/checkout@v7

      - name: Deploy to OpenShift
        uses: ./.github/actions/openshift-deploy
        with:
          branch: ${{ github.event.inputs.branch }}
          github_token: ${{ github.token }}
          sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          sentry_upload_sourcemaps: ${{ vars.SENTRY_UPLOAD_SOURCEMAPS || 'false' }}
          deployment_environment: test
          environment_label: Test
          image_name: test-hous-permit-portal
          release_version_prefix: test-${{ github.event.inputs.branch }}
          frontend_vars_json: ${{ toJSON(vars) }}
          registry_url: ${{ secrets.REGISTRY_URL }}
          builder_username: ${{ secrets.BUILDER_USERNAME }}
          builder_token: ${{ secrets.BUILDER_TOKEN }}
