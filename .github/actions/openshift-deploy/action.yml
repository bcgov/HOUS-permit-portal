name: Deploy to Openshift
description: Build and push the Rails/React application image to the OpenShift registry

inputs:
  branch:
    description: Branch to deploy
    required: true
  github_token:
    description: GitHub token for deployment status updates
    required: true
  deployment_environment:
    description: Deployment environment name for GitHub/Jira
    required: true
  environment_label:
    description: Environment label for logs
    required: true
  image_name:
    description: OpenShift image name
    required: true
  build_args:
    description: Docker build args
    required: true
  registry_url:
    description: OpenShift registry URL
    required: true
  builder_username:
    description: Registry service account username
    required: true
  builder_token:
    description: Registry service account token
    required: true

runs:
  using: composite
  steps:
    # Preserve workflow scripts before checkout switches to the application branch.
    - name: Prepare deployment scripts
      id: prepare-deployment-scripts
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        scripts_path=$(mktemp -d "${RUNNER_TEMP}/deployment-scripts.XXXXXX")
        cp -R "${ACTION_PATH}/scripts/." "$scripts_path/"
        echo "path=$scripts_path" >> "$GITHUB_OUTPUT"

    - name: Start GitHub deployment
      id: deployment-start
      uses: actions/github-script@v8
      env:
        DEPLOY_SCRIPTS_PATH: ${{ steps.prepare-deployment-scripts.outputs.path }}
        DEPLOY_BRANCH: ${{ inputs.branch }}
        DEPLOY_ENVIRONMENT: ${{ inputs.deployment_environment }}
        DEPLOY_DESCRIPTION: OpenShift deployment to ${{ inputs.environment_label }} for ${{ inputs.branch }}
        DEPLOY_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          await require(`${process.env.DEPLOY_SCRIPTS_PATH}/start.cjs`)({ github, context, core, env: process.env });

    - name: Install Git LFS
      id: install-git-lfs
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install git-lfs
        git lfs install

    - name: Checkout Code
      id: checkout-code
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.branch }}
        lfs: true

    - name: Hydrate and verify Git LFS assets
      id: hydrate-lfs-assets
      shell: bash
      run: |
        git lfs pull
        ruby <<'RUBY'
        pointer_header = "version https://git-lfs.github.com/spec/v1"
        unhydrated_paths =
          `git lfs ls-files --name-only`.lines.map(&:chomp).select do |path|
            File.file?(path) &&
              File.open(path, "rb") { |file| file.read(pointer_header.bytesize) } ==
                pointer_header
          end

        if unhydrated_paths.any?
          abort("Git LFS files were not hydrated:\n#{unhydrated_paths.join("\n")}")
        end
        RUBY

    - name: Update GITHUB_SHA with checked-out commit SHA
      id: capture-git-sha
      shell: bash
      run: echo "GITHUB_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

    - name: Confirm branch and SHA to deploy
      id: confirm-deploy-target
      shell: bash
      env:
        DEPLOY_BRANCH: ${{ inputs.branch }}
        ENVIRONMENT_LABEL: ${{ inputs.environment_label }}
      run: |
        echo "Deploying branch: ${DEPLOY_BRANCH} @ ${GITHUB_SHA} to ${ENVIRONMENT_LABEL}"

    - name: Build Docker Image
      id: build-image
      uses: redhat-actions/buildah-build@v3
      with:
        image: ${{ inputs.image_name }}
        tags: latest ${{ env.GITHUB_SHA }}
        labels: |
          app=${{ inputs.image_name }}
          git-sha=${{ env.GITHUB_SHA }}
        containerfiles: ./devops/docker/app/Dockerfile
        build-args: ${{ inputs.build_args }}

    - name: Push to Openshift Registry using Service Account
      id: push-image
      uses: redhat-actions/push-to-registry@v3
      with:
        image: ${{ inputs.image_name }}
        registry: ${{ inputs.registry_url }}
        username: ${{ inputs.builder_username }}
        password: ${{ inputs.builder_token }}

    - name: Finish GitHub deployment
      if: ${{ always() && steps.deployment-start.outputs.deployment_id != '' }}
      uses: actions/github-script@v8
      env:
        DEPLOY_SCRIPTS_PATH: ${{ steps.prepare-deployment-scripts.outputs.path }}
        DEPLOYMENT_ID: ${{ steps.deployment-start.outputs.deployment_id }}
        DEPLOY_ENVIRONMENT: ${{ steps.deployment-start.outputs.env }}
        DEPLOY_STATUS: ${{ steps.push-image.outcome == 'success' && 'success' || 'failure' }}
        DEPLOY_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        DEPLOY_ENV_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ inputs.branch }}
        DEPLOY_DESCRIPTION: OpenShift deployment to ${{ inputs.environment_label }} finished for ${{ inputs.branch }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          await require(`${process.env.DEPLOY_SCRIPTS_PATH}/finish.cjs`)({ github, context, core, env: process.env });
