# Local infrastructure only; Ruby and Node run on the host.
name: hous-permit-portal-local
services:
  postgres:
    image: postgres:15.10-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hous}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hous-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-hous_permit_portal_development}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.2.5-alpine
    command: [redis-server, --appendonly, "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 30
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      # Required on newer Apple Silicon CPUs with the bundled JVM.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m -XX:UseSVE=0"
      CLI_JAVA_OPTS: "-XX:UseSVE=0"
    ports:
      - "127.0.0.1:${ELASTICSEARCH_HOST_PORT:-19200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' | grep -q '"timed_out":false'
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command:
      - mini
      - -dir=/data
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -master.telemetry=false
      - -s3.allowedOrigins=http://localhost:3000,http://127.0.0.1:3000
      - -admin.user=hous-local
      - -admin.password=hous-local-password
    environment:
      AWS_ACCESS_KEY_ID: hous-local
      AWS_SECRET_ACCESS_KEY: hous-local-password
      S3_BUCKET: hous-local
    ports:
      - "127.0.0.1:${SEAWEEDFS_HOST_PORT:-19001}:8333"
      - "127.0.0.1:${SEAWEEDFS_ADMIN_HOST_PORT:-19002}:23646"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8333/readyz]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
  anycable-go:
    image: anycable/anycable-go:1.4.8
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      ANYCABLE_HOST: 0.0.0.0
      ANYCABLE_PORT: "8080"
      ANYCABLE_RPC_HOST: host.docker.internal:${ANYCABLE_RPC_PORT:-50051}
      ANYCABLE_REDIS_URL: redis://redis:6379/1
    ports:
      - "127.0.0.1:${ANYCABLE_HOST_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  seaweedfs_data:
