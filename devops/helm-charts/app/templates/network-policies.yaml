apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app: "permit-portal-routing"
  name: allow-from-openshift-ingress
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
  # Gotenberg is excluded. NetworkPolicies that select the same pod are unioned,
  # so a blanket allow would undo the gotenberg chart's ingress rule.
  podSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values:
          - gotenberg
  policyTypes:
    - Ingress
status: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app: "permit-portal-routing"
  name: allow-same-namespace
spec:
  ingress:
    - from:
        - podSelector: {}
  # Same exclusion as the ingress policy above. Other pods in this namespace
  # must not be able to submit HTML to Gotenberg.
  podSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values:
          - gotenberg
  policyTypes:
    - Ingress
status: {}
