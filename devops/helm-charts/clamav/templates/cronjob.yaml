apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.cronJob.name }}
spec:
  schedule: {{ .Values.cronJob.schedule }}
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: clamav
              image: "{{ .Values.cronJob.image.repository }}:{{ .Values.cronJob.image.tag }}"
              imagePullPolicy: {{ .Values.cronJob.imagePullPolicy }}
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  freshclam
                  echo "Cleaning up old database files..."
                  find /opt/app-root/src -type f \( -name "*.cvd" -o -name "*.cld" \) | \
                  sort | \
                  head -n -3 | \
                  xargs rm -f 2>/dev/null || true
                  echo "Cleanup complete"
              resources:
                {{- toYaml .Values.cronJob.resources | nindent 16 }}
              volumeMounts:
                - mountPath: /opt/app-root/src
                  name: signatures
          volumes:
            - name: signatures
              {{- if .Values.clamav.persistentVolume.enabled }}
              persistentVolumeClaim:
                claimName: {{ include "clamav.fullname" . }}-signatures
              {{- else }}
              emptyDir: {}
              {{- end }}
          restartPolicy: {{ .Values.cronJob.restartPolicy }}
  successfulJobsHistoryLimit: {{ .Values.cronJob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronJob.failedJobsHistoryLimit }}
