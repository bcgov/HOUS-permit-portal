# Global ClamAV Helm Chart Values
# Override environment-specific values in values-{STAGE}.yaml

clamav:
  name: clamav
  image: "clamav-scanner"
  tag: "latest"
  registry: ""  # Set in environment-specific values
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"         # CPU request
      memory: "128Mi"     # Memory request

  persistentVolume:
    enabled: true
    size: "500Mi"  # Persistent storage for virus signatures (keeps 3-4 versions)
    storageClassName: "netapp-file-standard"

  freshclam:
    mirrors: []  # Set in environment-specific values

  limits:
    fileSize: 30           # The largest file size scanable by clamav, in MB
    scanSize: 150          # The largest scan size permitted in clamav, in MB
    connectionQueueLength: 100
    maxThreads: 4
    sendBufTimeout: 500    # milliseconds

nameOverride: ""
fullnameOverride: "clamav-scanner"

service:
  name: clamav-service
  port: 3310
  type: ClusterIP
  sessionAffinity: ClientIP  # Sticky sessions: same client goes to same pod
  sessionAffinityTimeout: 3600  # Session timeout in seconds (1 hour)

pdb:
  create: false
  minAvailable: 1
  maxUnavailable: 1

cronJob:
  enabled: true
  name: clamav-freshclam
  schedule: "0 0,18 * * *"
  image:
    repository: ""  # Set in environment-specific values
    tag: "latest"
  imagePullPolicy: IfNotPresent
  resources: {}
  restartPolicy: OnFailure
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

