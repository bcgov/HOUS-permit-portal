apiVersion: v1
kind: ConfigMap
metadata:
  name: matomo-dashboard-php
  namespace: {{ .Release.Namespace }}
{{- $php := .Values.matomo.php | default dict }}
data:
  zz-global.ini: |
    expose_php={{ $php.expose_php | default "Off" }}
    opcache.memory_consumption={{ $php.opcache_memory_consumption | default "512" }}
    opcache.interned_strings_buffer={{ $php.opcache_interned_strings_buffer | default "16" }}
    opcache.save_comments={{ $php.opcache_save_comments | default "1" }}
    opcache.jit_buffer_size={{ $php.opcache_jit_buffer_size | default "256M" }}
    opcache.jit={{ $php.opcache_jit | default "1235" }}
    max_execution_time={{ $php.max_execution_time | default "300" }}
    post_max_size={{ $php.post_max_size | default "1500M" }}
    upload_max_filesize={{ $php.upload_max_filesize | default "32M" }}
    max_input_time={{ $php.max_input_time | default "3600" }}
    max_file_uploads={{ $php.opcache_max_file_upload | default "300" }}
    memory_limit={{ $php.memory_limit | default "2G" }}
    display_errors={{ $php.display_errors | default "Off" }}
    error_reporting={{ $php.error_reporting | default "22527" }}
    mysqli.reconnect={{ $php.mysqli_reconnect | default "On" }}
    mysqli.allow_local_infile={{ $php.mysqli_allow_local_infile | default "On" }}
    default_socket_timeout={{ $php.default_socket_timeout | default "20" }}
    max_input_vars={{ $php.max_input_vars | default "2000" }}
