{{- /*
  SENSITIVE DATA WARNING: this Secret is only rendered when
  backup.s3.createSecret is true, which means whatever is in
  backup.s3.accessKey / backup.s3.secretKey in your values file becomes the
  literal credential. Do NOT put real values there in any values file that
  gets committed to git. The recommended production setup is
  createSecret: false plus creating this Secret directly on the cluster with
  `oc create secret generic ... --from-literal=...` (see
  BACKUP-AND-RESTORE-GUIDE.md) so credentials never touch a file at all.
*/}}
{{- if and .Values.backup.enabled .Values.backup.s3.enabled .Values.backup.s3.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backup.s3.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: matomo-db-backup
type: Opaque
stringData:
  access-key: {{ .Values.backup.s3.accessKey | quote }}
  secret-key: {{ .Values.backup.s3.secretKey | quote }}
{{- end }}
