---
{{- if .Values.matomo.cli.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matomo-cli
  namespace: {{.Release.Namespace}}
  labels:
    app: matomo-cli
{{- if .Values.matomo.extralabels }}
{{ toYaml .Values.matomo.extralabels | indent 4 }}
{{- end }}
spec:
  replicas: {{.Values.matomo.cli.replicas}}
  selector:
    matchLabels:
      app: matomo-cli
  template:
    metadata:
      labels:
        app: matomo-cli
{{- if .Values.matomo.extralabels }}
{{ toYaml .Values.matomo.extralabels | indent 8 }}
{{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-matomo.yaml") . | sha256sum }}
    spec:
{{ include "matomo.init" . | nindent 6 }}
      containers:
      - name: matomo
        image: {{ include "matomo.image" (dict "registry" (.Values.matomo.imageRegistry | default .Values.global.imageRegistry) "image" .Values.matomo.image) }}
        {{- include "matomo.resources" (dict "resources" .Values.matomo.cli.resources "defaultResources" .Values.defaultResources) | nindent 8 }}
        {{- include "matomo.securityContext" (dict "runAsUser" .Values.matomo.runAsUser) | nindent 8 }}
        imagePullPolicy: Always
        env:
        - name: MATOMO_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.db.password.secretKeyRef.name }}
              key: {{ .Values.db.password.secretKeyRef.key }}
        {{- range .Values.matomo.env }}
        {{- if .valueFromSecret }}
        - name: {{ .name }}
          valueFrom:
            secretKeyRef:
              name: {{ .valueFromSecret.secretName | quote }}
              key: {{ .valueFromSecret.key | quote }}
        {{- else if .value }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        {{- end }}
{{- include "matomo.license" . | nindent 8 }}
        volumeMounts:
          - name: static-data
            mountPath: /var/www/html
          - name: matomo-common-config
            mountPath: /var/www/html/config/common.config.ini.php
            subPath: common.config.ini.php
            readOnly: true
{{ include "matomo.images.pullSecrets" ( dict "images" (list .Values.matomo) "global" .Values.global) | nindent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: matomo-configuration
        configMap:
          name: matomo-configuration
      - name: matomo-common-config
        configMap:
          name: matomo-configuration
          items:
          - key: common.config.ini.php
            path: common.config.ini.php
      - name: static-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: matomo-cli
  namespace: {{.Release.Namespace}}
  labels:
    app: matomo-cli
spec:
  ports:
    - port: 8080
      protocol: TCP
  selector:
    app: matomo-cli
{{- end -}}
