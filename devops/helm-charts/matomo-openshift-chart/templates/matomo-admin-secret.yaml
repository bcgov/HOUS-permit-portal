{{- /*
  Same idempotent pattern as templates/db-secret.yaml: reuse whatever
  password is already in this Secret across every `helm upgrade` (via
  lookup), only generating a fresh random one the very first time it doesn't
  exist yet. This means the admin password is never regenerated out from
  under a running install, and never needs to sit in a values file.
*/}}
{{- if .Values.matomo.dashboard.firstuser.createSecret }}
{{- $secretName := .Values.matomo.dashboard.firstuser.secretKeyRef.name -}}
{{- $secretKey := .Values.matomo.dashboard.firstuser.secretKeyRef.key -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := .Values.matomo.dashboard.firstuser.password | default (randAlphaNum 24) -}}
{{- if and $existing (hasKey $existing.data $secretKey) -}}
{{- $password = index $existing.data $secretKey | b64dec -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: matomo-admin
type: Opaque
stringData:
  username: {{ .Values.matomo.dashboard.firstuser.username | quote }}
  {{ $secretKey }}: {{ $password | quote }}
{{- end }}
