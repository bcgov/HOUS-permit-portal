apiVersion: v1
kind: ConfigMap
metadata:
  name: matomo-scheduledtasks-php
  namespace: {{ .Release.Namespace }}
{{- $php := .Values.matomo.cronJobs.scheduledTasks.php | default dict }}
{{- $base := .Values.matomo.php | default dict }}
data:
  zz-global.ini: |
    expose_php={{ $php.expose_php | default ($base.expose_php | default "Off") }}
    opcache.memory_consumption={{ $php.opcache_memory_consumption | default ($base.opcache_memory_consumption | default "512") }}
    opcache.jit_buffer_size={{ $php.opcache_jit_buffer_size | default ($base.opcache_jit_buffer_size | default "256M") }}
    opcache.jit={{ $php.opcache_jit | default ($base.opcache_jit | default "1235") }}
    max_execution_time={{ $php.max_execution_time | default "0" }}
    post_max_size={{ $php.post_max_size | default ($base.post_max_size | default "1500M") }}
    upload_max_filesize={{ $php.upload_max_filesize | default ($base.upload_max_filesize | default "32M") }}
    max_input_time={{ $php.max_input_time | default ($base.max_input_time | default "3600") }}
    max_file_uploads={{ $php.opcache_max_file_upload | default ($base.opcache_max_file_upload | default "300") }}
    memory_limit={{ $php.memory_limit | default "4G" }}
    display_errors={{ $php.display_errors | default ($base.display_errors | default "Off") }}
    error_reporting={{ $php.error_reporting | default ($base.error_reporting | default "22527") }}
    mysqli.reconnect={{ $php.mysqli_reconnect | default ($base.mysqli_reconnect | default "On") }}
    mysqli.allow_local_infile={{ $php.mysqli_allow_local_infile | default ($base.mysqli_allow_local_infile | default "On") }}
    default_socket_timeout={{ $php.default_socket_timeout | default ($base.default_socket_timeout | default "20") }}
    max_input_vars={{ $php.max_input_vars | default ($base.max_input_vars | default "2000") }}
