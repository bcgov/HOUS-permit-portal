apiVersion: v1
kind: ConfigMap
metadata:
  name: matomo-phpfpm
  namespace: {{ .Release.Namespace }}
{{- $fpm := .Values.matomo.phpfpm | default dict }}
data:
  zz-global.conf: |
    [www]
    pm = {{ $fpm.type | default "ondemand" }}
    pm.max_children = {{ $fpm.max_children | default 100 }}
    pm.start_servers = {{ $fpm.start_servers | default 5 }}
    pm.min_spare_servers = {{ $fpm.min_spare_servers | default 5 }}
    pm.max_spare_servers = {{ $fpm.max_spare_servers | default 75 }}
    pm.max_requests = {{ $fpm.max_requests | default 500 }}
    pm.process_idle_timeout = {{ $fpm.process_idle_timeout | default "480s" }}
    php_admin_value[memory_limit] = {{ $fpm.memory_limit | default "2048M" }}
    pm.status_path = {{ $fpm.status_path | default "/status" }}
