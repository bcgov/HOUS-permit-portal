# Example OpenShift install overrides.
# Mirror/import these images into the project first, or change the image names to match your ImageStreams.
namespace: d6af69-tools

global:
  imageRegistry: image-registry.openshift-image-registry.svc:5000/d6af69-tools
  imagePullSecrets: []
  storageClass: ""

defaultResources:
  limits:
    memory: 200Mi
  requests:
    cpu: 10m
    memory: 25Mi

matomo:
  image: matomo:5.11.2-fpm
  runAsUser: null
  site:
    name: Matomo
    url: https://dev.buildingcode.gov.bc.ca
  ingress:
    enabled: false
  dashboard:
    replicas: 1
    hostname: matomo-d6af69-tools.apps.silver.devops.gov.bc.ca
    tls: true
    firstuser:
      username: admin
      password:  clockedin2DB #change-me-admin-password
      email: BPH.Dev@gov.bc.ca
  tracker:
    enabled: true
    replicas: 1
    hostname: matomo-tracker-d6af69-tools.apps.silver.devops.gov.bc.ca
    tls: true
  cli:
    enabled: false
    replicas: 0
  queuedTrackingMonitor:
    enabled: false
  queuedTrackingProcess:
    enabled: false
    replicas: 0
  cronJobs:
    coreArchive:
      enabled: false
    scheduledTasks:
      enabled: false

nginx:
  image: nginx:1.21.6
  runAsUser: null

fpmExporter:
  image: php-fpm_exporter:2.2.0

db:
  enabled: true
  image: mariadb:11.4
  storage:
    size: 1Gi
    storageClass: ""
    mountPath: /var/lib/mysql
  auth:
    createSecret: true
    rootPassword: ""

openshift:
  route:
    enabled: true
    tls:
      enabled: true
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

networkPolicy:
  enabled: true
  allowOpenShiftIngress: true
  ingressNamespaceSelector:
    matchLabels:
      network.openshift.io/policy-group: ingress
