{{- if and .Values.db.enabled .Values.db.auth.createSecret }}
{{- $secretName := .Values.db.password.secretKeyRef.name -}}
{{- $secretKey := .Values.db.password.secretKeyRef.key -}}
{{- $existing := lookup "v1" "Secret" .Values.namespace $secretName -}}
{{- $password := .Values.db.auth.rootPassword | default (randAlphaNum 32) -}}
{{- if and $existing (hasKey $existing.data $secretKey) -}}
{{- $password = index $existing.data $secretKey | b64dec -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: matomo-db
type: Opaque
stringData:
  {{ $secretKey }}: {{ $password | quote }}
{{- end }}
