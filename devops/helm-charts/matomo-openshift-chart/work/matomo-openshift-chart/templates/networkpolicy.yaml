{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: matomo-allow-database
  namespace: {{ .Values.namespace }}
  labels:
    app: matomo
spec:
  podSelector:
    matchLabels:
      app: matomo-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: matomo-dashboard
        - podSelector:
            matchLabels:
              app: matomo-tracker
        - podSelector:
            matchLabels:
              app: matomo-cli
        - podSelector:
            matchLabels:
              app: matomo-queuedtracking-monitor
        - podSelector:
            matchLabels:
              app: matomo-queuedtracking-process
      ports:
        - protocol: TCP
          port: 3306
---
{{- if .Values.networkPolicy.allowOpenShiftIngress }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: matomo-allow-router
  namespace: {{ .Values.namespace }}
  labels:
    app: matomo
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - matomo-dashboard
          - matomo-tracker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
{{- end }}
