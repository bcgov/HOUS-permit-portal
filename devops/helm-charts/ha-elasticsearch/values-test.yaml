elasticsearch:
  image:
    registry: image-registry.openshift-image-registry.svc:5000
    repository: bb18ab-test/elasticsearch
    tag: 8.12.2-debian-12-r0
  master:
    replicaCount: 1
    heapSize: "512m"
    resources:
      requests:
        cpu: "50m"
        memory: "512Mi"
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: "500Mi"
  data:
    replicaCount: 1
    heapSize: "1024m"
    resources:
      requests:
        cpu: "200m"
        memory: "1024Mi"
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: "1Gi"
