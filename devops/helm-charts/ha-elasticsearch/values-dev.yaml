elasticsearch:
  master:
    replicaCount: 1
    heapSize: "512m"
    resources:
      requests:
        cpu: "30m"
        memory: "512Mi"
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: "500Mi"
  data:
    replicaCount: 1
    heapSize: "1024m"
    resources:
      requests:
        cpu: "100m"
        memory: "1024Mi"
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: "1Gi"
